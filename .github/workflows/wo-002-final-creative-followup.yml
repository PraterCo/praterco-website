name: WO-002 final creative follow-up checks

on:
  pull_request:
    branches:
      - fix/wo-002-final-creative-followup

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        working-directory: prototype/russ-v1
        run: npm run check
      - name: Automated tests
        working-directory: prototype/russ-v1
        run: npm test
